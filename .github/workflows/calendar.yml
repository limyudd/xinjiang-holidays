name: 更新新疆节假日日历

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - generate.py
      - sync_official.py
      - official.json
      - .github/workflows/calendar.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 检查新疆官方年度放假通知
        run: python sync_official.py
      - name: 生成中文日历
        run: python generate.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/xinjiang.ics official.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Xinjiang holiday calendar"
            git push
          fi
